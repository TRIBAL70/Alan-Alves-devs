services:
  - type: web
    name: alan-barber-php-tribal70
    runtime: docker
    repo: https://github.com/TRIBAL70/Alan-Alves-devs
    branch: alan-barber-php
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alan-barber-php-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: poetaofc@gmail.com
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
databases:
  - name: alan-barber-php-db
    plan: free
    region: oregon
    postgresMajorVersion: '17'
