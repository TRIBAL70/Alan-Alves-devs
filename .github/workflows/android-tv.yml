name: Compilar APK Android TV

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: |
          npm install
          npx expo install --fix --npm
          python3 -m pip install --break-system-packages pillow

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Adaptar para Android TV
        run: python3 prepare_tv.py

      - name: Compilar APK release com bundle JavaScript embarcado
        env:
          NODE_ENV: production
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Alan-Alves-Dev-Android-TV-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
